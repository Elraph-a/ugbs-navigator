<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 1270" width="1510" height="1270" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7d7d78"/></marker></defs>
<rect width="1510" height="1270" fill="#ffffff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#1c1d1f">System architecture: UGBS Service Navigator</text>
<text x="40" y="70" font-size="13" fill="#6c6c66">The model phrases answers. Offices, rooms, fees and steps come from the verified catalogue or a cited document, never from the model.</text>
<rect x="20" y="96" width="1460" height="100" rx="10" fill="none" stroke="#c9c9c4" stroke-width="1.25" stroke-dasharray="6 5"/><text x="34" y="118" font-size="15" fill="#6c6c66" font-weight="600" letter-spacing="0.6">USERS</text><rect x="20" y="214" width="1460" height="128" rx="10" fill="none" stroke="#c9c9c4" stroke-width="1.25" stroke-dasharray="6 5"/><text x="34" y="236" font-size="15" fill="#6c6c66" font-weight="600" letter-spacing="0.6">INTERFACE</text><rect x="420" y="360" width="700" height="770" rx="10" fill="none" stroke="#c9c9c4" stroke-width="1.25" stroke-dasharray="6 5"/><text x="434" y="382" font-size="15" fill="#6c6c66" font-weight="600" letter-spacing="0.6">AI SYSTEM — ONE CONVERSATIONAL TURN</text><rect x="20" y="470" width="390" height="400" rx="10" fill="none" stroke="#c9c9c4" stroke-width="1.25" stroke-dasharray="6 5"/><text x="34" y="492" font-size="15" fill="#6c6c66" font-weight="600" letter-spacing="0.6">KNOWLEDGE AND DATA</text><rect x="1150" y="940" width="320" height="280" rx="10" fill="none" stroke="#c9c9c4" stroke-width="1.25" stroke-dasharray="6 5"/><text x="1164" y="962" font-size="15" fill="#6c6c66" font-weight="600" letter-spacing="0.6">DECISION AND ACTION</text>
<path d="M 290.0 180.0 L 290.0 244.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 730.0 180.0 L 730.0 244.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 290.0 324.0 L 290.0 357.0 L 770.0 357.0 L 770.0 390.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 730.0 324.0 L 730.0 357.0 L 770.0 357.0 L 770.0 390.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770.0 448.0 L 770.0 466.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770.0 546.0 L 770.0 562.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770.0 642.0 L 770.0 658.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770.0 738.0 L 770.0 754.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770.0 854.0 L 770.0 868.0 L 650.0 868.0 L 650.0 882.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="665.0" y="851.0" width="90" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="710.0" y="862.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">answerable</text><path d="M 770.0 854.0 L 770.0 868.0 L 990.0 868.0 L 990.0 882.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="803.0" y="851.0" width="154" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="880.0" y="862.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">no verified source</text><path d="M 650.0 1006.0 L 650.0 1019.0 L 770.0 1019.0 L 770.0 1032.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 990.0 1006.0 L 990.0 1019.0 L 770.0 1019.0 L 770.0 1032.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 390.0 580.0 L 415.0 580.0 L 415.0 602.0 L 440.0 602.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 390.0 765.0 L 415.0 765.0 L 415.0 698.0 L 440.0 698.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 1100.0 1070.0 L 1135.0 1070.0 L 1135.0 1035.0 L 1170.0 1035.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 1310.0 1090.0 L 1310.0 1120.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="124" width="340" height="56" rx="28.0" fill="#1c1d1f" stroke="#1c1d1f" stroke-width="1.5"/><text x="290.0" y="153.3" text-anchor="middle" font-size="15.6" font-weight="600" fill="#ffffff">UGBS student</text><rect x="560" y="124" width="340" height="56" rx="28.0" fill="#1c1d1f" stroke="#1c1d1f" stroke-width="1.5"/><text x="730.0" y="153.3" text-anchor="middle" font-size="15.6" font-weight="600" fill="#ffffff">UGBS administrative staff</text><rect x="120" y="244" width="340" height="80" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="290.0" y="264.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Chat interface</text><text x="290.0" y="288.3" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Streamed reply, citations, office card,</text><text x="290.0" y="306.5" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">steps</text><rect x="560" y="244" width="340" height="80" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="730.0" y="264.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Administrative dashboard</text><text x="730.0" y="288.3" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Demand, gap register, deflection,</text><text x="730.0" y="306.5" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">forecast</text><rect x="440" y="390" width="660" height="58" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="770.0" y="408.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">FastAPI service</text><text x="770.0" y="432.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">/chat/stream · /analytics · /services</text><rect x="440" y="466" width="660" height="80" rx="8" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="770.0" y="495.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">1. Triage</text><text x="770.0" y="519.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">In scope, small talk or off topic — and rewrite a follow-up into a full question</text><rect x="440" y="562" width="660" height="80" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="770.0" y="591.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">2. Route</text><text x="770.0" y="615.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Question to service and office — a table lookup, never a model</text><rect x="440" y="658" width="660" height="80" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="770.0" y="687.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">3. Retrieve</text><text x="770.0" y="711.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Embeddings and keywords over the document index, fused into one ranking</text><polygon points="770.0,754 1100,804.0 770.0,854 440,804.0" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="770.0" y="793.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">4. Confidence gate</text><text x="770.0" y="817.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Too weak a match: the model is not called at all</text><rect x="440" y="882" width="420" height="124" rx="8" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="650.0" y="914.9" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">5. Compose the reply</text><text x="650.0" y="939.2" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">The model phrases an answer from the retrieved</text><text x="650.0" y="957.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">text and the verified procedure. It supplies no</text><text x="650.0" y="975.7" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">facts of its own.</text><polygon points="880,882 1086,882 1100,896 1100,1006 880,1006" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="990.0" y="924.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#7d2f24">5b. Decline</text><text x="990.0" y="948.3" text-anchor="middle" font-size="14.6" fill="#7d2f24" opacity="0.72">Name what is not covered</text><text x="990.0" y="966.5" text-anchor="middle" font-size="14.6" fill="#7d2f24" opacity="0.72">and which office to ask</text><rect x="440" y="1032" width="660" height="76" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="770.0" y="1059.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">6. Redact, then log</text><text x="770.0" y="1083.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Names, IDs, phone numbers and emails removed before anything is written</text><rect x="40" y="500" width="350" height="160" rx="8" fill="#f2effa" stroke="#9b8ec4" stroke-width="1.5"/><text x="215.0" y="550.9" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Verified procedure catalogue</text><text x="215.0" y="575.2" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">services.json and offices.json — rooms,</text><text x="215.0" y="593.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">fees, contacts and steps, transcribed by</text><text x="215.0" y="611.7" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">hand from the published sources</text><rect x="40" y="690" width="350" height="150" rx="8" fill="#f2effa" stroke="#9b8ec4" stroke-width="1.5"/><text x="215.0" y="738.2" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c1d1f">Document index</text><text x="215.0" y="760.8" text-anchor="middle" font-size="13.3" fill="#1c1d1f" opacity="0.72">Published UG and UGBS documents, chunked and</text><text x="215.0" y="777.4" text-anchor="middle" font-size="13.3" fill="#1c1d1f" opacity="0.72">embedded, each carrying its source, date and</text><text x="215.0" y="794.1" text-anchor="middle" font-size="13.3" fill="#1c1d1f" opacity="0.72">real-or-synthetic label</text><rect x="1170" y="980" width="280" height="110" rx="8" fill="#f2effa" stroke="#9b8ec4" stroke-width="1.5"/><text x="1310.0" y="1024.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Enquiry log</text><text x="1310.0" y="1048.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Redacted, with a retention limit</text><rect x="1170" y="1120" width="280" height="80" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="1310.0" y="1140.0" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Analytics</text><text x="1310.0" y="1164.3" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">What to publish next, where to</text><text x="1310.0" y="1182.5" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">add staff</text>
</svg>