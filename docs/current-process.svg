<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1200" width="1420" height="1200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7d7d78"/></marker></defs>
<rect width="1420" height="1200" fill="#ffffff"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#1c1d1f">As-is process: requesting an official transcript</text>
<text x="40" y="70" font-size="13" fill="#6c6c66">Transcribed from the University of Ghana's published procedure. Numbered notes mark where a student must already know something the process never asks.</text>

<path d="M 250.0 158.0 L 250.0 190.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 360.0 236.0 L 480.0 236.0 L 480.0 250.0 L 600.0 250.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="403.0" y="219.0" width="34" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="420.0" y="230.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">yes</text><path d="M 250.0 282.0 L 250.0 340.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258.0" y="300.0" width="26" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="260.0" y="311.0" text-anchor="start" font-size="14" font-weight="600" fill="#5c5c57">no</text><path d="M 360.0 386.0 L 480.0 386.0 L 480.0 378.0 L 600.0 378.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="403.0" y="369.0" width="34" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="420.0" y="380.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">yes</text><path d="M 775.0 406.0 L 775.0 418.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 250.0 432.0 L 250.0 500.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258.0" y="455.0" width="26" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="260.0" y="466.0" text-anchor="start" font-size="14" font-weight="600" fill="#5c5c57">no</text><path d="M 360.0 546.0 L 480.0 546.0 L 480.0 540.0 L 600.0 540.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="403.0" y="529.0" width="34" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="420.0" y="540.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">yes</text><path d="M 775.0 580.0 L 775.0 582.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 775.0 638.0 L 775.0 646.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 250.0 592.0 L 250.0 660.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258.0" y="615.0" width="26" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="260.0" y="626.0" text-anchor="start" font-size="14" font-weight="600" fill="#5c5c57">no</text><path d="M 250.0 732.0 L 250.0 748.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 250.0 820.0 L 250.0 836.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 250.0 908.0 L 250.0 920.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 360.0 966.0 L 480.0 966.0 L 480.0 976.0 L 600.0 976.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="403.0" y="949.0" width="34" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="420.0" y="960.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c57">yes</text><path d="M 250.0 1012.0 L 250.0 1080.0" fill="none" stroke="#7d7d78" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258.0" y="1035.0" width="26" height="18" rx="3" fill="#ffffff" opacity="0.92"/><text x="260.0" y="1046.0" text-anchor="start" font-size="14" font-weight="600" fill="#5c5c57">no</text>
<rect x="100.0" y="100" width="300" height="58" rx="29.0" fill="#1c1d1f" stroke="#1c1d1f" stroke-width="1.5"/><text x="250.0" y="120.1" text-anchor="middle" font-size="15.6" font-weight="600" fill="#ffffff">Student needs an official</text><text x="250.0" y="140.4" text-anchor="middle" font-size="15.6" font-weight="600" fill="#ffffff">transcript</text><polygon points="250.0,190 360,236.0 250.0,282 140,236.0" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="250.0" y="227.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Postgraduate</text><text x="250.0" y="247.4" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">student?</text><rect x="600" y="210" width="350" height="80" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="775.0" y="230.0" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Email the School of Graduate Studies</text><text x="775.0" y="254.3" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">sgstranscript@ug.edu.gh — a different</text><text x="775.0" y="272.5" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">office entirely</text><polygon points="250.0,340 360,386.0 250.0,432 140,386.0" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="250.0" y="377.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Graduated</text><text x="250.0" y="397.4" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">before 1996?</text><rect x="600" y="350" width="350" height="56" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="775.0" y="379.3" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Pay at the Cash Office</text><rect x="600" y="418" width="350" height="80" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="775.0" y="447.1" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Submit the receipt at Room D2, AAD</text><text x="775.0" y="471.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Ready for collection in about two weeks</text><polygon points="250.0,500 360,546.0 250.0,592 140,546.0" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="250.0" y="537.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Needed the</text><text x="250.0" y="557.4" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">same day?</text><rect x="600" y="500" width="350" height="80" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="775.0" y="520.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Submit the request before 11:00 AM</text><text x="775.0" y="544.3" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Express is not available on the STS</text><text x="775.0" y="562.5" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">portal</text><rect x="600" y="582" width="350" height="56" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="775.0" y="611.3" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Pay at the Cash Office</text><rect x="600" y="646" width="350" height="80" rx="8" fill="#eaf2ec" stroke="#7ba488" stroke-width="1.5"/><text x="775.0" y="675.1" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Submit the receipt at Room D2, AAD</text><text x="775.0" y="699.4" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Typically ready within 24 hours — GH₵60</text><rect x="100.0" y="660" width="300" height="72" rx="8" fill="#eef1f8" stroke="#8a9ac0" stroke-width="1.5"/><text x="250.0" y="675.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Check your record on the MIS</text><text x="250.0" y="695.3" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">portal</text><text x="250.0" y="719.6" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">mis.ug.edu.gh</text><rect x="100.0" y="748" width="300" height="72" rx="8" fill="#eef1f8" stroke="#8a9ac0" stroke-width="1.5"/><text x="250.0" y="763.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Submit the request and pay on the</text><text x="250.0" y="783.3" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">STS portal</text><text x="250.0" y="807.6" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">sts.ug.edu.gh</text><rect x="100.0" y="836" width="300" height="72" rx="8" fill="#eef1f8" stroke="#8a9ac0" stroke-width="1.5"/><text x="250.0" y="863.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Track the request on the same</text><text x="250.0" y="883.4" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">portal</text><polygon points="250.0,920 360,966.0 250.0,1012 140,966.0" fill="#fdf3df" stroke="#d9a934" stroke-width="1.5"/><text x="250.0" y="957.1" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Collected by</text><text x="250.0" y="977.4" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">someone else?</text><rect x="600" y="930" width="350" height="92" rx="8" fill="#f4f4f2" stroke="#b9b9b4" stroke-width="1.5"/><text x="775.0" y="955.0" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">Bring a consent letter, the owner's ID</text><text x="775.0" y="975.3" text-anchor="middle" font-size="15.6" font-weight="500" fill="#1c1d1f">and the proxy's ID</text><text x="775.0" y="999.6" text-anchor="middle" font-size="14.6" fill="#1c1d1f" opacity="0.72">Only discoverable at the collection desk</text><rect x="100.0" y="1080" width="300" height="58" rx="29.0" fill="#e8e8e5" stroke="#8f8f8a" stroke-width="1.5"/><text x="250.0" y="1110.3" text-anchor="middle" font-size="15.6" font-weight="600" fill="#1c1d1f">Transcript issued</text><polygon points="1010,96 1356,96 1370,110 1370,220 1010,220" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="140.6" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">1. Four different routes, and the student</text><text x="1190.0" y="159.2" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">must know which one applies before starting.</text><text x="1190.0" y="177.7" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">Nothing asks them.</text><polygon points="1010,248 1356,248 1370,262 1370,372 1010,372" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="283.3" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">2. Three separate systems: MIS Web for</text><text x="1190.0" y="301.9" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">records, the STS portal for the request and</text><text x="1190.0" y="320.4" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">payment, the Cash Office for express and</text><text x="1190.0" y="339.0" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">pre-1996 routes.</text><polygon points="1010,400 1356,400 1370,414 1370,524 1010,524" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="435.3" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">3. Two offices own “transcripts”.</text><text x="1190.0" y="453.9" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">Postgraduate requests go to the School of</text><text x="1190.0" y="472.4" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">Graduate Studies, which is one line on the</text><text x="1190.0" y="491.0" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">AAD's page.</text><polygon points="1010,552 1356,552 1370,566 1370,676 1010,676" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="596.6" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">4. Express eligibility is a time-of-day rule</text><text x="1190.0" y="615.2" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">— before 11:00 AM — visible only to a</text><text x="1190.0" y="633.7" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">student who reads the whole page first.</text><polygon points="1010,704 1356,704 1370,718 1370,828 1010,828" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="739.3" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">5. Six fee variants by delivery mode: GH₵30</text><text x="1190.0" y="757.9" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">pick-up, GH₵85 by post, US$55 courier, US$10</text><text x="1190.0" y="776.5" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">digital, GH₵60 express, GH₵25 per extra</text><text x="1190.0" y="795.0" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">copy.</text><polygon points="1010,856 1356,856 1370,870 1370,980 1010,980" fill="#fcecea" stroke="#c96a5c" stroke-width="1.25"/><text x="1190.0" y="900.6" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">6. Proxy rules surface at the collection</text><text x="1190.0" y="919.2" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">desk. A student who did not read ahead makes</text><text x="1190.0" y="937.7" text-anchor="middle" font-size="14.3" font-weight="500" fill="#7d2f24">a second trip.</text>
</svg>