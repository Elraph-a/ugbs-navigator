# Source manifest for the UGBS Service Navigator knowledge base.
#
# Every entry is a published University of Ghana or UGBS source. `tools/collect_sources.py`
# fetches these into data/raw/ and writes data/raw/SOURCES.md with access dates.
#
# Adding a source: give it a stable id, a real title, the category it serves, and the
# publication date if the page states one. Leave published_date null when unknown -- the
# dashboard measures how much of our corpus is undated or old, and guessing corrupts that.
#
# `authority: primary` means the office that owns the procedure published it. Prefer
# primary sources; a secondary source may be indexed but is ranked below a primary one.
#
# Sources that fail are recorded in SOURCES.md rather than removed, so the gap stays
# visible. The old1.ug.edu.gh mirror serves a navigation-only shell for these pages and
# was dropped after the extraction quality gate caught it.

sources:
  # --- Transcripts ---------------------------------------------------------
  - id: transcript_request
    title: "Transcript Requests and Payment"
    url: https://www.ug.edu.gh/aad/resources/academic-support-services/transcript-request
    category: transcripts
    publisher: "Academic Affairs Directorate, University of Ghana"
    authority: primary
    published_date: null

