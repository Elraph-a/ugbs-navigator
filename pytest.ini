[pytest]
testpaths = tests
python_files = test_*.py

# langsmith ships a pytest plugin that imports `uuid_utils`, whose compiled DLL
# is blocked by the Windows Application Control policy on the lab machine. The
# plugin is pulled in by langchain, which this project does not use, and its
# failure happens during pytest start-up so it takes the whole run down before a
# single test is collected. ChromaDB itself falls back cleanly when uuid_utils is
# unavailable, so nothing in the application is affected.
addopts = -p no:langsmith_plugin
